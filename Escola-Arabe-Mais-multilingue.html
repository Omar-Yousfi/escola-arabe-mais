<style>
:root{
  --bg:#f6efe3;--bg2:#ecdfca;--card:#fbf7ee;--ink:#3a291f;--muted:#7b6a5b;--line:#e1d2ba;
  --pri:#b4543a;--pri-ink:#fff;--green:#687c65;--foot:#3b2b22;--foot-ink:#f5eadb;
  --shadow:0 18px 40px -28px rgba(70,45,30,.5);
  --svg-a:#b4543a;--svg-b:#ecdfc6;--svg-c:#d8c3a0;--svg-d:#7a4a35;--svg-e:#6f866b;--svg-bg:#efd9c4;
}
[data-theme=dark]{
  --bg:#1c1814;--bg2:#241f1a;--card:#2a241e;--ink:#f1e6d3;--muted:#b9a894;--line:#43382d;
  --pri:#e0875f;--pri-ink:#2a1a10;--green:#7f9a7a;--foot:#120f0c;--foot-ink:#f1e6d3;
  --shadow:0 18px 40px -28px #000;
  --svg-a:#d27652;--svg-b:#4a4034;--svg-c:#5d4f3f;--svg-d:#9c6a4d;--svg-e:#86a281;--svg-bg:#3a2d24;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.6;
  background-image:radial-gradient(circle at 15% 0%,rgba(180,84,58,.07),transparent 45%),radial-gradient(circle at 100% 30%,rgba(104,124,101,.07),transparent 40%)}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
.display{font-family:Fraunces,Georgia,"Times New Roman",serif}
.ar{font-family:"Aref Ruqaa","Amiri","Noto Naskh Arabic",serif}
.arui{font-family:Cairo,"Segoe UI",Tahoma,sans-serif}

/* cabeçalho */
header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:76px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo{width:50px;height:50px;border-radius:14px;object-fit:cover;flex:none}
.brand b{display:block;font-size:19px;line-height:1.15}
.brand small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:2px}
nav.main{display:flex;gap:26px}
nav.main a{text-decoration:none;font-weight:600;font-size:14px;color:var(--muted);padding:6px 0;border-bottom:2px solid transparent}
nav.main a:hover,nav.main a.on{color:var(--pri);border-color:var(--pri)}
.actions{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:12px;border:2px solid var(--pri);background:var(--pri);color:var(--pri-ink);font:700 14px/1.2 inherit;font-family:inherit;text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 24px -14px var(--pri)}
.btn.ghost{background:transparent;color:var(--pri)}
.btn.small{min-height:42px;padding:0 18px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.menu-btn{display:none}
.mobile-nav{display:none;border-top:1px solid var(--line);padding:10px 22px 16px}
.mobile-nav a{display:block;padding:12px 4px;text-decoration:none;font-weight:600;border-bottom:1px solid var(--line)}
.mobile-nav.open{display:block}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center;padding:64px 0 70px}
.hero h1{font-size:clamp(40px,6vw,68px);line-height:1.04;margin:0;letter-spacing:-.02em;font-weight:700}
.hero .calli{font-size:clamp(46px,7vw,84px);line-height:1.2;color:var(--pri);margin:6px 0 8px}
.hero .sub{font-weight:700;font-size:18px;margin:10px 0 8px}
.hero p.lead{color:var(--muted);max-width:540px;margin:0 0 26px}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px}
.art{position:relative;width:100%;max-width:540px;margin:0 auto}
.art svg{width:100%;height:auto}
.art .photo{aspect-ratio:1/1.03;border-radius:46% 46% 34% 34%;border:1px solid var(--line);background:var(--bg2);padding:10px;box-shadow:var(--shadow)}
.art .photo img{width:100%;height:100%;object-fit:cover;border-radius:46% 46% 34% 34%}
.art svg.flag{position:absolute;top:6%;right:4%;width:60px;height:60px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}

/* secções */
section{scroll-margin-top:90px}
.band{background:var(--bg2);padding:72px 0}
h2.title{font-size:clamp(30px,4vw,44px);line-height:1.12;margin:0 0 10px;font-weight:700}
.lead2{color:var(--muted);max-width:640px;margin:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:34px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.card .ic{width:56px;height:56px;border-radius:17px;background:var(--bg2);color:var(--pri);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.card .ar{font-size:24px;color:var(--pri);line-height:1.3;margin:0}
.card h3{margin:0;font-size:24px;line-height:1.2}
.card p{margin:6px 0 0;color:var(--muted);font-size:15px;white-space:pre-line}
.card .pic{width:100%;height:150px;object-fit:cover;border-radius:14px;margin-bottom:10px}
.card .more{margin-top:auto;padding-top:14px;font-weight:700;color:var(--pri);text-decoration:none;font-size:14px}
.video{margin-top:12px;border-radius:14px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/9;background:#000}
.video iframe{width:100%;height:100%;border:0}
.files{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.files a{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:13px;font-weight:600;color:var(--pri);text-decoration:none}

.why{background:linear-gradient(180deg,var(--bg2),color-mix(in srgb,var(--pri) 12%,var(--bg2)));padding:64px 0}
.why h2{text-align:center}
.whygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:30px}
.whyitem{display:flex;gap:14px;align-items:flex-start}
.whyitem .ic{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--pri);color:var(--pri);display:flex;align-items:center;justify-content:center}
.whyitem b{display:block;font-size:18px}
.whyitem span{color:var(--muted);font-size:14px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:36px;box-shadow:var(--shadow);display:grid;grid-template-columns:.9fr 1.1fr;gap:34px}
form.enroll{display:grid;grid-template-columns:1fr 1fr;gap:14px}
form.enroll .full{grid-column:1/-1}
label.f{display:block;font-size:13px;font-weight:700;color:var(--muted)}
input.in{width:100%;margin-top:6px;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 14px;font:inherit}
input.in:focus{outline:2px solid var(--pri);outline-offset:1px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted)}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--pri)}
.hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
.msg{padding:12px 14px;border-radius:12px;font-weight:600;font-size:14px}
.msg.ok{background:color-mix(in srgb,var(--green) 18%,var(--card));color:var(--ink);border:1px solid var(--green)}
.msg.err{background:color-mix(in srgb,#c0392b 14%,var(--card));border:1px solid #c0392b}

.contact{background:var(--bg2);border-radius:28px;padding:46px;text-align:left;position:relative;overflow:hidden}
.contact .big{position:absolute;right:20px;top:-30px;font-size:190px;line-height:1;opacity:.07;color:var(--pri)}
.contact .row{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}

footer.foot{background:var(--foot);color:var(--foot-ink);margin-top:70px}
footer .wrap{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:24px;padding-top:34px;padding-bottom:34px;align-items:center}
footer a{text-decoration:none}
footer .small{font-size:13px;opacity:.8}
footer .adm{opacity:.7;font-size:12px;text-decoration:underline}

.wa{position:fixed;right:18px;bottom:18px;z-index:40;width:58px;height:58px;border-radius:50%;background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px -8px rgba(0,0,0,.5);border:3px solid var(--bg)}
.wa:hover{transform:translateY(-3px)}
.reveal{animation:rise .7s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.reveal{animation:none}html{scroll-behavior:auto}}

@media (max-width:900px){
  nav.main,.actions .btn{display:none}
  .menu-btn{display:inline-flex}
  .hero{grid-template-columns:1fr;padding:40px 0 50px}
  .grid3,.whygrid{grid-template-columns:1fr}
  .panel{grid-template-columns:1fr;padding:24px}
  footer .wrap{grid-template-columns:1fr}
  .contact{padding:30px 24px}
}
@media (max-width:520px){form.enroll{grid-template-columns:1fr}.wrap{padding:0 16px}}
noscript p{padding:24px;text-align:center}

/* Alternativa 4 — benefícios modernos na paleta original */
.why{background:var(--bg);padding:76px 0 82px;position:relative;overflow:hidden}
.why:before{content:"عربي وأكثر";position:absolute;right:-36px;top:-54px;font:700 190px Cairo,sans-serif;color:color-mix(in srgb,var(--pri) 8%,transparent);direction:rtl;pointer-events:none}
.why h2{text-align:center;position:relative;margin-bottom:12px}
.why h2:after{content:"رحلة علم ومعرفة";display:block;margin:12px auto 0;color:var(--pri);font:700 25px Cairo,sans-serif;direction:rtl;line-height:1.2}
.whygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:42px;position:relative}
.whyitem{display:block;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;min-height:226px;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s}
.whyitem:hover{transform:translateY(-4px);box-shadow:0 18px 34px -24px rgba(70,45,30,.55)}
.whyitem .ic{width:50px;height:50px;border-radius:15px;border:0;background:var(--bg2);color:var(--pri);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.whyitem:nth-child(2) .ic{background:color-mix(in srgb,var(--green) 20%,var(--card));color:var(--green)}
.whyitem:nth-child(3) .ic{background:color-mix(in srgb,var(--pri) 16%,var(--card));color:var(--pri)}
.whyitem b{display:block;font-size:20px;line-height:1.2;margin-bottom:9px}
.whyitem span{color:var(--muted);font-size:15px;line-height:1.55}
@media (max-width:900px){.whygrid{grid-template-columns:1fr}.why:before{font-size:120px;right:-30px;top:-20px}}

html,body{overflow-x:hidden;max-width:100%;}
.lang-switch{display:flex;align-items:center;gap:3px;padding:3px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}.lang-option{border:0;border-radius:9px;background:transparent;color:var(--muted);padding:8px 7px;font:700 11px/1 inherit;cursor:pointer;touch-action:manipulation;transition:background .2s,color .2s,transform .2s}.lang-option:hover,.lang-option.active{background:var(--pri);color:var(--pri-ink)}.lang-option:active{transform:scale(.95)}.lang-option:focus{outline:2px solid var(--pri);outline-offset:1px}
body.arabic-mode{width:100%;overflow-x:hidden}body.arabic-mode body{text-align:right;width:100%;min-width:0;overflow-x:hidden}body.arabic-mode .wrap{width:100%;min-width:0;max-width:1180px}body.arabic-mode .top .wrap{width:100%}body.arabic-mode .top .wrap,body.arabic-mode .actions,body.arabic-mode .brand{direction:rtl}body.arabic-mode nav.main{direction:rtl}body.arabic-mode .hero,body.arabic-mode .panel,body.arabic-mode footer .wrap{direction:rtl}body.arabic-mode .hero .cta,body.arabic-mode .contact .row{justify-content:flex-start}body.arabic-mode .contact{text-align:right}body.arabic-mode .contact .big{right:auto;left:20px}
@media(max-width:900px){.lang-switch{padding:3px}.lang-option{padding:8px 6px}.actions{gap:7px}}
</style>

      h('div', { class: 'ic' }, icon(t.icon, 28)),
      t.arabic ? h('p', { class: 'ar', lang: 'ar', dir: 'rtl' }, t.arabic) : null,
      h('h3', { class: 'display' }, t.title),
      h('p', null, t.description),
      video(t.youtubeUrl), files(t.materials),
      h('a', { class: 'more', href: '#inscricao' }, C.ui.start + ' →'));
  }
  function section(s) {
    return h('article', { class: 'card' },
      s.arabic ? h('p', { class: 'ar', lang: 'ar', dir: 'rtl' }, s.arabic) : null,
      h('h3', { class: 'display' }, s.title),
      s.image ? h('img', { class: 'pic', style: 'height:190px;margin-top:8px', src: s.image, alt: s.title, loading: 'lazy' }) : null,
      h('p', null, s.body), video(s.youtubeUrl), files(s.materials));
  }

  function enrollForm() {
    var msg = h('div', { role: 'status', 'aria-live': 'polite' });
    var email = h('input', { class: 'in', type: 'email', name: 'email', autocomplete: 'email', required: true, maxlength: '254' });
    var phone = h('input', { class: 'in', type: 'tel', name: 'phone', autocomplete: 'tel', required: true, maxlength: '30', placeholder: '+55 ...' });
    var age = h('input', { class: 'in', type: 'number', name: 'age', min: '5', max: '120', required: true, inputmode: 'numeric' });
    var city = h('input', { class: 'in', type: 'text', name: 'city', autocomplete: 'address-level2', required: true, maxlength: '80' });
    var hp = h('input', { class: 'hp', type: 'text', name: 'website', tabindex: '-1', autocomplete: 'off', 'aria-hidden': 'true' });
    var consent = h('input', { type: 'checkbox', required: true });
    var btn = h('button', { class: 'btn full', type: 'submit' }, C.enroll.button);
    var form = h('form', { class: 'enroll', novalidate: true },
      h('label', { class: 'f' }, C.ui.email, email), h('label', { class: 'f' }, C.ui.phone, phone),
      h('label', { class: 'f' }, C.ui.age, age), h('label', { class: 'f' }, C.ui.city, city), hp,
      h('label', { class: 'check full' }, consent, h('span', null, C.enroll.consent)),
      h('div', { class: 'full' }, btn), h('div', { class: 'full' }, msg));
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      msg.className = ''; msg.textContent = '';
      if (!form.checkValidity()) { form.reportValidity(); return; }
      btn.disabled = true;
      fetch('/api/register', {
        method: 'POST', headers: { 'content-type': 'application/json', 'x-requested-with': 'school' },
        body: JSON.stringify({ email: email.value, phone: phone.value, age: Number(age.value), city: city.value, consent: consent.checked, website: hp.value })
      }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (x) {
          if (x.ok) { form.reset(); msg.className = 'msg ok'; msg.textContent = C.enroll.success; }
          else { msg.className = 'msg err'; msg.textContent = x.d && x.d.error || C.ui.genericError; }
        }).catch(function () { msg.className = 'msg err'; msg.textContent = C.ui.noConnection; })
        .then(function () { btn.disabled = false; });
    });
    return form;
  }

  function build() {
    var b = C.brand;
    var tracks = C.tracks.filter(function (t) { return t.visible; });
    var why = C.why.filter(function (t) { return t.visible; });
    var secs = C.sections.filter(function (t) { return t.visible; });

    var nav = h('nav', { class: 'main', 'aria-label': 'Principal' });
    var mnav = h('nav', { class: 'mobile-nav', id: 'mnav', 'aria-label': 'Menu móvel' });
    C.nav.forEach(function (n) {
      if (n.target === '#recursos' && !secs.length) return;
      nav.appendChild(h('a', { href: n.target }, n.label));
      mnav.appendChild(h('a', { href: n.target, onclick: function () { mnav.classList.remove('open'); } }, n.label));
    });

    var themeBtn = h('button', { class: 'iconbtn', id: 'theme-btn', type: 'button', onclick: function () { setTheme(theme() === 'dark' ? 'light' : 'dark'); } });
    var menuBtn = h('button', { class: 'iconbtn menu-btn', type: 'button', 'aria-label': C.ui.menu, onclick: function () { mnav.classList.toggle('open'); } }, icon('menu', 20));

    var header = h('header', { class: 'top' },
      h('div', { class: 'wrap' },
        h('a', { class: 'brand', href: '#inicio' }, logo(50),
          h('span', null, h('b', { class: 'display' }, b.name), h('span', { class: 'ar', lang: 'ar', dir: 'rtl', style: 'display:block;color:var(--pri);font-size:15px;line-height:1.2' }, b.arabicName), h('small', null, b.subtitle))),
        nav,
        h('div', { class: 'actions' }, languageControl(), themeBtn, h('a', { class: 'btn small', href: '#inscricao' }, C.ui.signup), menuBtn)),
      mnav);

    var art = h('div', { class: 'art reveal' });
    if (C.hero.image) art.appendChild(h('div', { class: 'photo' }, h('img', { src: C.hero.image, alt: C.hero.title })));
    else { var w = document.createElement('div'); w.innerHTML = heroArt; art.appendChild(w.firstChild); }
    var f = document.createElement('div'); f.innerHTML = flagSvg; art.appendChild(f.firstChild);

    var hero = h('section', { id: 'inicio', class: 'wrap hero' },
      h('div', { class: 'reveal' },
        h('h1', { class: 'display' }, C.hero.title),
        h('div', { class: 'ar calli', lang: 'ar', dir: 'rtl' }, C.hero.arabic),
        h('p', { class: 'sub' }, C.hero.subtitle),
        h('p', { class: 'lead' }, C.hero.paragraph),
        h('div', { class: 'cta' },
          h('a', { class: 'btn', href: '#inscricao' }, C.hero.primaryButton),
          h('a', { class: 'btn ghost', href: '#cursos' }, C.hero.secondaryButton))),
      art);

    var coursesSec = h('section', { id: 'cursos', class: 'band' }, h('div', { class: 'wrap' },
      h('h2', { class: 'title display' }, C.tracksTitle), h('p', { class: 'lead2' }, C.tracksIntro),
      tracks.length ? h('div', { class: 'grid3' }, tracks.map(track)) : h('p', { class: 'lead2', style: 'margin-top:24px' }, 'Em breve.')));

    var whySec = h('section', { id: 'sobre', class: 'why' }, h('div', { class: 'wrap' },
      h('h2', { class: 'title display' }, C.whyTitle),
      h('div', { class: 'whygrid' }, why.map(function (p) {
        return h('div', { class: 'whyitem' }, h('div', { class: 'ic' }, icon(p.icon, 22)), h('div', null, h('b', null, p.title), h('span', null, p.description)));
      }))));

    var resSec = secs.length ? h('section', { id: 'recursos', class: 'wrap', style: 'padding:70px 22px 0' }, h('div', { class: 'grid3', style: 'margin-top:0' }, secs.map(section))) : null;

    var enrollSec = h('section', { id: 'inscricao', class: 'wrap', style: 'padding-top:70px' },
      h('div', { class: 'panel' },
        h('div', null, h('h2', { class: 'title display' }, C.enroll.title), h('p', { class: 'lead2' }, C.enroll.text)),
        enrollForm()));

    var contactSec = h('section', { id: 'contato', class: 'wrap', style: 'padding-top:70px' },
      h('div', { class: 'contact' },
        h('div', { class: 'big ar', 'aria-hidden': 'true' }, 'سلام'),
        h('h2', { class: 'title display', style: 'position:relative' }, C.contact.title),
        h('p', { class: 'lead2', style: 'position:relative' }, C.contact.text),
        h('div', { class: 'row', style: 'position:relative' },
          h('a', { class: 'btn', href: wa, target: '_blank', rel: 'noopener' }, icon('phone', 18), C.ui.whatsapp),
          h('a', { class: 'btn ghost', href: 'mailto:' + b.email }, b.email))));

    var foot = h('footer', { class: 'foot' }, h('div', { class: 'wrap' },
      h('div', { style: 'display:flex;gap:12px;align-items:center' }, logo(44),
        h('div', null, h('b', { class: 'display' }, b.name), h('div', { class: 'ar', lang: 'ar', dir: 'rtl', style: 'color:#e0a98c' }, b.arabicName))),
      h('div', { class: 'small' }, h('div', null, b.subtitle),
        h('div', null, h('a', { href: 'mailto:' + b.email }, b.email)),
        h('div', null, h('a', { href: wa, target: '_blank', rel: 'noopener' }, b.phone))),
      h('div', { class: 'small' }, h('div', null, b.copyright), h('a', { class: 'adm', href: '/admin' }, C.ui.admin))));

    var fab = h('a', { class: 'wa', href: wa, target: '_blank', rel: 'noopener', 'aria-label': C.ui.waAria }, icon('phone', 26));

    document.documentElement.lang = currentLang === 'ar' ? 'ar' : currentLang;
    document.documentElement.dir = 'ltr';
    document.body.dir = 'ltr';
    document.body.classList.toggle('arabic-mode', currentLang === 'ar');
    document.title = C.meta.title;
    var app = document.getElementById('app');
    app.innerHTML = '';
    append(app, [header, h('main', null, hero, coursesSec, whySec, resSec, enrollSec, contactSec), foot, fab]);
    setTheme(theme());
  }
  C = LANGS[currentLang];
  build();
})();
</script>

</body></html>
